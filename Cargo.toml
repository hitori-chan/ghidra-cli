[package]
name = "ghidra-cli"
version = "0.4.1"
edition = "2021"
authors = ["Alexander Kiselev"]
description = "Rust CLI to run Ghidra headless for reverse engineering with Claude Code and other agents"
license = "GPL-3.0"
repository = "https://github.com/akiselev/ghidra-cli"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "env", "cargo"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# BinDiff database (.BinDiff is SQLite)
rusqlite = { version = "0.40", features = ["bundled"] }

# Parsing
pest = "2.9"
pest_derive = "2.9"

# Output formatting
comfy-table = "8.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
env_logger = "0.11"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Async runtime (only needed for setup command's HTTP downloads)
tokio = { version = "1.35", features = ["rt", "io-util", "time", "net"] }

# Time
# Hashing
md5 = "0.7"

# File system & paths
dirs = "7.0"
tempfile = "3.8"
walkdir = "2.4"

# Process management
which = "8.0"
libc = "0.2"

# Regex
regex = "1.10"

# Setup command dependencies
reqwest = { version = "0.13", features = ["json", "stream", "rustls"] }
zip = "8.6"
futures-util = "0.3"
indicatif = "0.18"


[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.8"
serial_test = "4.0"
uuid = { version = "1.6", features = ["v4"] }
# Snapshot testing - captures full output and detects regressions
insta = { version = "1.40", features = ["json", "redactions"] }

[lib]
name = "ghidra_cli"
path = "src/lib.rs"

[[bin]]
name = "gd"
path = "src/main.rs"
